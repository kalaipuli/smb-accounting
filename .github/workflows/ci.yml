name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secrets scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install

      - name: Lint
        run: poetry run ruff check src/ tests/ && poetry run ruff format --check src/ tests/

      - name: Type check
        run: poetry run mypy src/ --strict

      - name: Unit tests
        run: poetry run pytest tests/unit/ -q --tb=short

      - name: Unit tests with coverage
        run: poetry run pytest tests/unit/ -q --cov=src --cov-report=term-missing

      - name: Dead code check
        run: poetry run vulture src/ --min-confidence 80

      - name: No hardcoded DB connection outside src/db/schema.py
        run: |
          if grep -rln "sqlite3.connect(" src/ --include="*.py" | grep -v "src/db/schema.py"; then
            echo "sqlite3.connect() called outside src/db/schema.py"
            exit 1
          fi

      - name: No duplicate class declarations
        run: |
          dupes=$(grep -rn "^class " src/ --include="*.py" | awk -F: '{print $NF}' | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "Duplicate class declarations: $dupes"
            exit 1
          fi

      - name: Build
        run: poetry build

      - name: Integration tests
        run: poetry run pytest tests/integration -q --tb=short
